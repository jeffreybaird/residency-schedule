name: Deploy to Digital Ocean

on:
  push:
    branches: [main]

env:
  MIX_ENV: prod
  ELIXIR_VERSION: "1.18"
  OTP_VERSION: "27"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: residency_schedule_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: _build
          key: ${{ runner.os }}-build-${{ hashFiles('**/mix.lock') }}

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test
        env:
          DATABASE_URL: ecto://postgres:postgres@localhost/residency_schedule_test
          MIX_ENV: test

  deploy:
    name: Deploy (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: test

    # Both targets build the same release; only the destination, systemd unit,
    # and post-migrate seeding differ. A demo failure must not abort prod.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: prod
            host_secret: DEPLOY_HOST
            install_dir: /home/deploy/residency_schedule
            service: residency_schedule
            port: 4000
            seed_demo: false
          - target: demo
            host_secret: DEMO_DEPLOY_HOST
            install_dir: /home/deploy/residency_schedule_demo
            service: residency_schedule_demo
            port: 4002
            seed_demo: true

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}

      - run: mix deps.get --only prod

      - run: mix assets.deploy
        env:
          MIX_ENV: prod

      - run: mix release
        env:
          MIX_ENV: prod
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          PHX_HOST: ${{ secrets.PHX_HOST }}
          # ACCESS_PASSWORD is NOT needed here — runtime.exs runs at boot, not
          # at compile time. It lives only in the target's .env

      - name: Upload release to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets[matrix.host_secret] }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "_build/prod/rel/residency_schedule"
          target: "${{ matrix.install_dir }}_new"
          strip_components: 4

      - name: Swap release and restart
        uses: appleboy/ssh-action@v1.0.3
        env:
          INSTALL_DIR: ${{ matrix.install_dir }}
          SERVICE: ${{ matrix.service }}
          SEED_DEMO: ${{ matrix.seed_demo }}
          APP_PORT: ${{ matrix.port }}
        with:
          host: ${{ secrets[matrix.host_secret] }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: INSTALL_DIR,SERVICE,SEED_DEMO,APP_PORT
          script: |
            set -e

            # Run migrations before swapping (uses server .env for real DB creds)
            # set -a exports all sourced variables to child processes
            set -a; source "$INSTALL_DIR/.env"; set +a
            "${INSTALL_DIR}_new/bin/residency_schedule" eval \
              "ResidencySchedule.Release.migrate()"

            # Demo deployments reload their synthetic fixture every deploy, so
            # anything a visitor changed is discarded.
            if [ "$SEED_DEMO" = "true" ]; then
              "${INSTALL_DIR}_new/bin/residency_schedule" eval \
                "ResidencySchedule.Release.seed_demo()"
            fi

            # Carry the .env into the new release before swapping — it lives
            # inside the deployment dir and must not be lost during rotation.
            cp "$INSTALL_DIR/.env" "${INSTALL_DIR}_new/.env"

            # Atomic swap — remove any stale _old dir first so mv doesn't
            # move into a subdirectory instead of renaming.
            rm -rf "${INSTALL_DIR}_old"
            mv "$INSTALL_DIR" "${INSTALL_DIR}_old"
            mv "${INSTALL_DIR}_new" "$INSTALL_DIR"

            # Restart service
            sudo systemctl restart "$SERVICE"

            # Health check — if it fails, roll back automatically.
            # systemctl state alone is not enough: a release that crash-loops
            # reports "activating" while restarting, and a release that starts
            # but cannot serve still counts as running. Poll the port instead.
            healthy=false
            for _ in $(seq 1 15); do
              if curl -fsS -o /dev/null --max-time 3 "http://127.0.0.1:${APP_PORT}/"; then
                healthy=true
                break
              fi
              sleep 2
            done

            if [ "$healthy" != "true" ]; then
              journalctl -u "$SERVICE" -n 30 --no-pager || true
              mv "$INSTALL_DIR" "${INSTALL_DIR}_failed"
              mv "${INSTALL_DIR}_old" "$INSTALL_DIR"
              sudo systemctl restart "$SERVICE"
              echo "Deploy failed — rolled back" && exit 1
            fi

            rm -rf "${INSTALL_DIR}_old"
