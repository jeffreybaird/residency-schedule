name: Deploy to Digital Ocean

on:
  push:
    branches: [main]

env:
  MIX_ENV: prod
  ELIXIR_VERSION: "1.18"
  OTP_VERSION: "27"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: residency_schedule_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: _build
          key: ${{ runner.os }}-build-${{ hashFiles('**/mix.lock') }}

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test
        env:
          DATABASE_URL: ecto://postgres:postgres@localhost/residency_schedule_test
          MIX_ENV: test

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}

      - run: mix deps.get --only prod

      - run: mix assets.deploy
        env:
          MIX_ENV: prod

      - run: mix release
        env:
          MIX_ENV: prod
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          PHX_HOST: ${{ secrets.PHX_HOST }}
          # ACCESS_PASSWORD is NOT needed here — runtime.exs runs at boot, not
          # at compile time. It lives only in /home/deploy/residency_schedule/.env

      - name: Upload release to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "_build/prod/rel/residency_schedule"
          target: "/home/deploy/residency_schedule_new"
          strip_components: 4

      - name: Swap release and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            # Run migrations before swapping (uses server .env for real DB creds)
            # set -a exports all sourced variables to child processes
            set -a; source /home/deploy/residency_schedule/.env; set +a
            /home/deploy/residency_schedule_new/bin/residency_schedule eval \
              "ResidencySchedule.Release.migrate()"

            # Carry the .env into the new release before swapping — it lives
            # inside the deployment dir and must not be lost during rotation.
            cp /home/deploy/residency_schedule/.env /home/deploy/residency_schedule_new/.env

            # Atomic swap — remove any stale _old dir first so mv doesn't
            # move into a subdirectory instead of renaming.
            rm -rf /home/deploy/residency_schedule_old
            mv /home/deploy/residency_schedule /home/deploy/residency_schedule_old
            mv /home/deploy/residency_schedule_new /home/deploy/residency_schedule

            # Restart service
            sudo systemctl restart residency_schedule

            # Health check — if it fails, roll back automatically
            sleep 3
            systemctl is-active residency_schedule || (
              mv /home/deploy/residency_schedule_old /home/deploy/residency_schedule
              sudo systemctl restart residency_schedule
              echo "Deploy failed — rolled back" && exit 1
            )

            rm -rf /home/deploy/residency_schedule_old
