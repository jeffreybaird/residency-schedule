name: Deploy to Digital Ocean

on:
  push:
    branches: [main, codex/phase0-release-artifacts]
  workflow_dispatch:

env:
  MIX_ENV: prod
  ELIXIR_VERSION: "1.19.5"
  OTP_VERSION: "28.5.0.7"

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: residency_schedule_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
      - name: Cache build
        uses: actions/cache@v4
        with:
          path: _build
          key: ${{ runner.os }}-build-${{ hashFiles('**/mix.lock') }}
      - run: ruby test/deploy/release_artifacts_test.rb
      - name: Validate synthetic demo schedule
        run: python3 -m unittest discover -s test -p '*_test.py'
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test
        env:
          DATABASE_URL: ecto://postgres:postgres@localhost/residency_schedule_test
          MIX_ENV: test

  build:
    name: Build immutable release
    # The release bundles ERTS and native code (e.g. the bcrypt NIF), so it must be
    # built on the droplet's OS (Ubuntu 24.04, see DEPLOY.md). Never use
    # ubuntu-latest here: a newer image links against a newer glibc.
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
      - run: mix deps.get --only prod
      - name: Package deployment commit
        run: printf '%s\n' "$GITHUB_SHA" > priv/deploy_sha
      - run: mix assets.deploy
      # Runtime credentials are provided only by the selected GitHub environment.
      - run: mix release
      - run: bash deploy/package_release.sh _build/prod/rel/residency_schedule artifact "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: artifact/
          if-no-files-found: error

  staging:
    name: Rehearse (${{ matrix.target }})
    runs-on: ubuntu-24.04
    needs: [test, build]
    environment: ${{ matrix.target }}
    concurrency:
      group: deploy-${{ matrix.target }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: staging
            host_secret: STAGING_DEPLOY_HOST
            install_dir: /home/deploy/residency_schedule_staging
            service: residency_schedule_staging
            port: 4004
            seed_demo: false
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: artifact/
      - name: Upload immutable artifact and promotion tools
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets[matrix.host_secret] }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "artifact,deploy"
          target: "${{ matrix.install_dir }}.incoming/${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Render private environment configuration
        env:
          DEPLOY_TARGET: ${{ matrix.target }}
          CONFIG_ENVIRONMENT: ${{ vars.CONFIG_ENVIRONMENT }}
          EXPECTED_DATABASE_NAME: ${{ vars.EXPECTED_DATABASE_NAME }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          PHX_HOST: ${{ vars.PHX_HOST }}
          ACCESS_PASSWORD: ${{ secrets.ACCESS_PASSWORD }}
          RESEND_API_KEY: ''
          RELEASE_COOKIE: ${{ secrets.RELEASE_COOKIE }}
          PORT: ${{ matrix.port }}
          HTTP_IP: ${{ vars.HTTP_IP }}
          POOL_SIZE: ${{ vars.POOL_SIZE }}
          DB_SSL: ${{ vars.DB_SSL }}
          ROSTER_PATH: ${{ vars.ROSTER_PATH }}
          CHAT_ENABLED: 'false'
          ANTHROPIC_API_KEY: ''
          OTEL_ENABLED: 'false'
          OTEL_EXPORTER_OTLP_ENDPOINT: ''
          OTEL_HUB_TOKEN: ''
          OTEL_RESOURCE_ATTRIBUTES: ''
        run: ruby deploy/runtime_config.rb render runtime-config/runtime.json
      - name: Hand private configuration to transfer container
        run: |
          test -d runtime-config && test ! -L runtime-config
          test -f runtime-config/runtime.json && test ! -L runtime-config/runtime.json
          sudo chown --no-dereference 1000:1000 runtime-config runtime-config/runtime.json
      - name: Prepare private configuration inbox
        uses: appleboy/ssh-action@v1.0.3
        env:
          INSTALL_DIR: ${{ matrix.install_dir }}
          DEPLOY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        with:
          host: ${{ secrets[matrix.host_secret] }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: INSTALL_DIR,DEPLOY_RUN_ID
          script: |
            set -eu
            umask 077
            test ! -L "${INSTALL_DIR}.config-incoming"
            test ! -L "${INSTALL_DIR}.config-incoming/${DEPLOY_RUN_ID}"
            install -d -m 700 "${INSTALL_DIR}.config-incoming" "${INSTALL_DIR}.config-incoming/${DEPLOY_RUN_ID}"
      - name: Transfer private configuration separately
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets[matrix.host_secret] }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "runtime-config/runtime.json"
          strip_components: 1
          target: "${{ matrix.install_dir }}.config-incoming/${{ github.run_id }}-${{ github.run_attempt }}"
          tar_tmp_path: "${{ matrix.install_dir }}.config-incoming/${{ github.run_id }}-${{ github.run_attempt }}/"
      - name: Promote retained release
        uses: appleboy/ssh-action@v1.0.3
        env:
          INSTALL_DIR: ${{ matrix.install_dir }}
          SERVICE: ${{ matrix.service }}
          SEED_DEMO: ${{ matrix.seed_demo }}
          APP_PORT: ${{ matrix.port }}
          RELEASE_ID: ${{ github.sha }}
          DEPLOY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          ARTIFACT_DIR: ${{ matrix.install_dir }}.incoming/${{ github.run_id }}-${{ github.run_attempt }}/artifact
          CONFIG_FILE: ${{ matrix.install_dir }}.config-incoming/${{ github.run_id }}-${{ github.run_attempt }}/runtime.json
          DEPLOY_TARGET: ${{ matrix.target }}
        with:
          host: ${{ secrets[matrix.host_secret] }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: INSTALL_DIR,SERVICE,SEED_DEMO,APP_PORT,RELEASE_ID,DEPLOY_RUN_ID,ARTIFACT_DIR,CONFIG_FILE,DEPLOY_TARGET
          script: bash "${ARTIFACT_DIR%/artifact}/deploy/promote_release.sh"
      - name: Remove private local configuration
        if: always()
        run: sudo rm -f -- runtime-config/runtime.json
      - name: Remove private remote configuration inbox
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        env:
          INSTALL_DIR: ${{ matrix.install_dir }}
          DEPLOY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        with:
          host: ${{ secrets[matrix.host_secret] }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: INSTALL_DIR,DEPLOY_RUN_ID
          script: rm -rf -- "${INSTALL_DIR}.config-incoming/${DEPLOY_RUN_ID}"

  deploy:
    name: Deploy (${{ matrix.target }})
    runs-on: ubuntu-24.04
    needs: [test, build, staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: ${{ matrix.target }}
    concurrency:
      group: deploy-${{ matrix.target }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: prod
            host_secret: DEPLOY_HOST
            install_dir: /home/deploy/residency_schedule
            service: residency_schedule
            port: 4000
            seed_demo: false
          - target: demo
            host_secret: DEMO_DEPLOY_HOST
            install_dir: /home/deploy/residency_schedule_demo
            service: residency_schedule_demo
            port: 4002
            seed_demo: true
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: artifact/
      - name: Upload immutable artifact and promotion tools
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets[matrix.host_secret] }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "artifact,deploy"
          target: "${{ matrix.install_dir }}.incoming/${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Render private environment configuration
        env:
          DEPLOY_TARGET: ${{ matrix.target }}
          CONFIG_ENVIRONMENT: ${{ vars.CONFIG_ENVIRONMENT }}
          EXPECTED_DATABASE_NAME: ${{ vars.EXPECTED_DATABASE_NAME }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          PHX_HOST: ${{ vars.PHX_HOST }}
          ACCESS_PASSWORD: ${{ matrix.target == 'prod' && secrets.ACCESS_PASSWORD || '' }}
          RESEND_API_KEY: ${{ matrix.target == 'prod' && secrets.RESEND_API_KEY || '' }}
          RELEASE_COOKIE: ${{ secrets.RELEASE_COOKIE }}
          PORT: ${{ matrix.port }}
          HTTP_IP: ${{ vars.HTTP_IP }}
          POOL_SIZE: ${{ vars.POOL_SIZE }}
          DB_SSL: ${{ vars.DB_SSL }}
          ROSTER_PATH: ${{ vars.ROSTER_PATH }}
          CHAT_ENABLED: ${{ matrix.target == 'prod' && vars.CHAT_ENABLED || '' }}
          ANTHROPIC_API_KEY: ${{ matrix.target == 'prod' && secrets.ANTHROPIC_API_KEY || '' }}
          OTEL_ENABLED: ${{ matrix.target == 'prod' && vars.OTEL_ENABLED || '' }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ matrix.target == 'prod' && vars.OTEL_EXPORTER_OTLP_ENDPOINT || '' }}
          OTEL_HUB_TOKEN: ${{ matrix.target == 'prod' && secrets.OTEL_HUB_TOKEN || '' }}
          OTEL_RESOURCE_ATTRIBUTES: ${{ matrix.target == 'prod' && vars.OTEL_RESOURCE_ATTRIBUTES || '' }}
        run: ruby deploy/runtime_config.rb render runtime-config/runtime.json
      - name: Hand private configuration to transfer container
        run: |
          test -d runtime-config && test ! -L runtime-config
          test -f runtime-config/runtime.json && test ! -L runtime-config/runtime.json
          sudo chown --no-dereference 1000:1000 runtime-config runtime-config/runtime.json
      - name: Prepare private configuration inbox
        uses: appleboy/ssh-action@v1.0.3
        env:
          INSTALL_DIR: ${{ matrix.install_dir }}
          DEPLOY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        with:
          host: ${{ secrets[matrix.host_secret] }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: INSTALL_DIR,DEPLOY_RUN_ID
          script: |
            set -eu
            umask 077
            test ! -L "${INSTALL_DIR}.config-incoming"
            test ! -L "${INSTALL_DIR}.config-incoming/${DEPLOY_RUN_ID}"
            install -d -m 700 "${INSTALL_DIR}.config-incoming" "${INSTALL_DIR}.config-incoming/${DEPLOY_RUN_ID}"
      - name: Transfer private configuration separately
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets[matrix.host_secret] }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "runtime-config/runtime.json"
          strip_components: 1
          target: "${{ matrix.install_dir }}.config-incoming/${{ github.run_id }}-${{ github.run_attempt }}"
          tar_tmp_path: "${{ matrix.install_dir }}.config-incoming/${{ github.run_id }}-${{ github.run_attempt }}/"
      - name: Promote retained release
        uses: appleboy/ssh-action@v1.0.3
        env:
          INSTALL_DIR: ${{ matrix.install_dir }}
          SERVICE: ${{ matrix.service }}
          SEED_DEMO: ${{ matrix.seed_demo }}
          APP_PORT: ${{ matrix.port }}
          RELEASE_ID: ${{ github.sha }}
          DEPLOY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          ARTIFACT_DIR: ${{ matrix.install_dir }}.incoming/${{ github.run_id }}-${{ github.run_attempt }}/artifact
          CONFIG_FILE: ${{ matrix.install_dir }}.config-incoming/${{ github.run_id }}-${{ github.run_attempt }}/runtime.json
          DEPLOY_TARGET: ${{ matrix.target }}
        with:
          host: ${{ secrets[matrix.host_secret] }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: INSTALL_DIR,SERVICE,SEED_DEMO,APP_PORT,RELEASE_ID,DEPLOY_RUN_ID,ARTIFACT_DIR,CONFIG_FILE,DEPLOY_TARGET
          script: bash "${ARTIFACT_DIR%/artifact}/deploy/promote_release.sh"
      - name: Remove private local configuration
        if: always()
        run: sudo rm -f -- runtime-config/runtime.json
      - name: Remove private remote configuration inbox
        if: always()
        uses: appleboy/ssh-action@v1.0.3
        env:
          INSTALL_DIR: ${{ matrix.install_dir }}
          DEPLOY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        with:
          host: ${{ secrets[matrix.host_secret] }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: INSTALL_DIR,DEPLOY_RUN_ID
          script: rm -rf -- "${INSTALL_DIR}.config-incoming/${DEPLOY_RUN_ID}"
